<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; height: 90vh; margin-top: 5vh; }
        .chat-header { background-color: #6200ea; color: white; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 80%; line-height: 1.4; font-size: 0.9rem; }
        .user-message { background-color: #6200ea; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background-color: #e0e0e0; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { padding: 10px 20px; background-color: #6200ea; color: white; border: none; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #3700b3; }
        /* Loading animation */
        .typing { font-style: italic; color: #888; font-size: 0.8rem; margin-left: 10px; display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🎓 Study Buddy AI</div>
    <div class="chat-box" id="chat-box">
        <div class="message bot-message">Hello! I'm your AI Tutor. What topic are we studying today?</div>
    </div>
    <div class="typing" id="typing-indicator">Typing...</div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type a topic..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Ask</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const typingIndicator = document.getElementById('typing-indicator');

    function handleEnter(event) {
        if (event.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. Add User Message to Screen
        addMessage(text, 'user-message');
        userInput.value = '';
        typingIndicator.style.display = 'block';

        try {
            // 2. Call your Java Spring Boot API
            const response = await fetch(`/api/study/ask?topic=${encodeURIComponent(text)}`);
            const data = await response.text();

            // 3. Add Bot Response to Screen
            addMessage(data, 'bot-message');
        } catch (error) {
            addMessage("Error: Could not connect to the bot.", 'bot-message');
        } finally {
            typingIndicator.style.display = 'none';
        }
    }

    function addMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight; // Auto scroll to bottom
    }
</script>

</body>
</html>
