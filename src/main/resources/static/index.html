<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy</title>
    <style>
        /* --- Layout & Colors --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 90vh; margin-top: 5vh; }
        .chat-header { background: linear-gradient(135deg, #6200ea, #3700b3); color: white; padding: 20px; text-align: center; font-size: 1.4rem; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: #f9f9f9; }

        /* --- Messages --- */
        .message { padding: 12px 18px; border-radius: 18px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .user-message { background-color: #6200ea; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background-color: #ffffff; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #e0e0e0; }

        /* --- Quiz --- */
        .quiz-container { background-color: #fff8e1; border: 1px solid #ffe082; }
        .quiz-option { margin: 8px 0; padding: 8px; border-radius: 8px; cursor: pointer; }
        .quiz-option:hover { background-color: rgba(0,0,0,0.05); }

        /* --- Input Area --- */
        .input-area { padding: 20px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 25px; outline: none; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: #6200ea; }

        button { padding: 10px 20px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; transition: transform 0.1s; color: white; }
        button:active { transform: scale(0.95); }
        .btn-ask { background-color: #6200ea; }
        .btn-quiz { background-color: #ff9800; }

        /* --- Upload Button --- */
        .file-upload-label { cursor: pointer; padding: 10px; border-radius: 50%; background-color: #eee; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .file-upload-label:hover { background-color: #ddd; }

        .typing { font-style: italic; color: #888; font-size: 0.8rem; padding: 0 20px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🎓 AI Study Buddy</div>
    <div class="chat-box" id="chat-box">
        <div class="message bot-message">
            Hello! I'm your AI Tutor.<br>
            📎 <b>Upload a PDF</b> to chat with your notes, or just ask me a question!
        </div>
    </div>
    <div class="typing" id="typing-indicator">Typing...</div>

    <div class="input-area">
        <input type="file" id="pdf-upload" accept=".pdf" style="display: none;" onchange="uploadFile()">

        <label for="pdf-upload" class="file-upload-label" title="Upload PDF">
            📎
        </label>

        <input type="text" id="user-input" placeholder="Type a topic..." onkeypress="handleEnter(event)">
        <button class="btn-ask" onclick="sendMessage()">Ask</button>
        <button class="btn-quiz" onclick="sendQuiz()">Quiz</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const typingIndicator = document.getElementById('typing-indicator');

    function handleEnter(event) { if (event.key === 'Enter') sendMessage(); }

    // --- 1. Chat ---
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        addMessage(text, 'user-message');
        userInput.value = '';
        showTyping(true);
        try {
            const response = await fetch(`/api/study/ask?topic=${encodeURIComponent(text)}`);
            const data = await response.text();
            addMessage(data, 'bot-message');
        } catch (error) { addMessage("Error connecting.", 'bot-message'); }
        finally { showTyping(false); }
    }

    // --- 2. Quiz ---
    async function sendQuiz() {
        const text = userInput.value.trim();
        if (!text) { alert("Type a topic first!"); return; }
        addMessage("Give me a quiz on: " + text, 'user-message');
        userInput.value = '';
        showTyping(true);
        try {
            const response = await fetch(`/api/study/quiz?topic=${encodeURIComponent(text)}`);
            const quiz = await response.json();
            renderQuiz(quiz);
        } catch (error) { addMessage("Error generating quiz.", 'bot-message'); }
        finally { showTyping(false); }
    }

    // --- 3. Upload PDF (NEW!) ---
    async function uploadFile() {
        const fileInput = document.getElementById('pdf-upload');
        const file = fileInput.files[0];
        if (!file) return;

        addMessage(`📄 Uploading: ${file.name}...`, 'user-message');
        showTyping(true);

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch('/api/ingest', {
                method: 'POST',
                body: formData
            });
            const result = await response.text(); // The backend returns a plain String message
            addMessage(result, 'bot-message'); // Show "Success!" or "Error"
        } catch (error) {
            addMessage("❌ Upload Failed: " + error, 'bot-message');
        } finally {
            showTyping(false);
            fileInput.value = ""; // Reset input
        }
    }

    // --- Helpers ---
    function renderQuiz(quiz) {
        const div = document.createElement('div');
        div.className = 'message bot-message quiz-container';
        let options = quiz.options.map(opt =>
            `<div class="quiz-option" onclick="checkAnswer(this, '${quiz.correctAnswer}')">
                <label>⚪ ${opt}</label>
             </div>`).join('');
        div.innerHTML = `<strong>❓ Quiz:</strong><br>${quiz.question}${options}<div class="result-msg"></div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.checkAnswer = function(div, correct) {
        const text = div.innerText.replace('⚪ ', '').trim();
        const resultDiv = div.parentElement.querySelector('.result-msg');
        if (text === correct || text.startsWith(correct)) { // Loose matching
            resultDiv.innerHTML = "<br><span style='color:green'>✅ Correct!</span>";
        } else {
            resultDiv.innerHTML = `<br><span style='color:red'>❌ Wrong. Answer: ${correct}</span>`;
        }
    }

    function addMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    function showTyping(show) { typingIndicator.style.display = show ? 'block' : 'none'; }
</script>

</body>
</html>
